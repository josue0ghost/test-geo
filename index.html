<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAC Clientes Guatemala</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 360px;
            width: 90%;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
        }
        .logo img { width: 180px; margin-bottom: 16px; }
        h1 { font-size: 20px; color: #1a1a1a; margin-bottom: 8px; }
        p { font-size: 14px; color: #666; line-height: 1.5; margin-bottom: 32px; }
        button {
            background: #CC0000;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        button:active { opacity: 0.85; }
        .note { font-size: 12px; color: #999; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo"><img src="BACCredomatic.jpeg" alt="BAC Credomatic"></div>
        <h1>Mejora tu experiencia</h1>
        <p>Para mostrarte las sucursales y cajeros más cercanos, necesitamos acceder a tu ubicación.</p>
        <button onclick="window.location.href='location.html'">
            Activar servicios de ubicación
        </button>
        <p class="note">Solo se usa para mostrarte servicios cercanos</p>
    </div>
</body>
</html>
